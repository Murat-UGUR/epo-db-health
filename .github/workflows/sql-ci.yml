name: SQL CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sql-server:
    name: Run scripts on SQL Server 2022 (mock ePO schema)
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: CiOnly_Throwaway_Pa55!   # throwaway password for the ephemeral CI container
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly_Throwaway_Pa55!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v6
      - name: Execute every script and check results
        run: bash tests/ci/run_sql_ci.sh "${{ job.services.mssql.id }}" "$SA_PASSWORD"
      - name: Run run_all.ps1 end to end and check its reports
        shell: pwsh
        run: ./tests/ci/test_runner.ps1 -Password $env:SA_PASSWORD
      - name: Upload script output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-output
          path: |
            ci-output/
            runner-output/

  windows-powershell:
    name: run_all.ps1 on Windows PowerShell 5.1 (SQL Server LocalDB, Windows auth)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          $exe = (Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue).Source
          if (-not $exe) {
            choco install sqllocaldb --no-progress -y
            $exe = (Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter SqlLocalDB.exe |
                    Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          if (-not $exe) { throw 'SqlLocalDB.exe not found' }
          & $exe create ci -s
          & $exe info ci
      - name: Load mock ePO schema
        shell: pwsh
        run: ./tests/ci/load_sql.ps1 -Server '(localdb)\ci' -Path tests/ci/mock_epo_schema.sql
      - name: Run run_all.ps1 under Windows PowerShell 5.1 and check its reports
        shell: powershell
        run: .\tests\ci\test_runner.ps1 -Server '(localdb)\ci'
      - name: Upload runner output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runner-output-windows
          path: runner-output/

  powershell:
    name: Lint PowerShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = @(
            Invoke-ScriptAnalyzer -Path ./run_all.ps1 -Severity Error
            Invoke-ScriptAnalyzer -Path ./tests/ci -Severity Error
          )
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
